<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>前往 Facebook 登入</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fafaf9; color: #44403c;
    font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: #1877f2; font-weight: 700; }
  .s { width: 28px; height: 28px; border: 3px solid #e7e5e4; border-top-color: #1877f2; border-radius: 50%; margin: 0 auto 14px; animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div>
  <div class="s"></div>
  <p id="m">正在前往 Facebook 登入…</p>
</div>
<script>
  // 手機登入的中繼頁：從自己的網站「自動」轉到 Facebook，瀏覽器才不會把授權頁交給 Facebook App 開（App 裡常顯示「無法載入」）
  (function () {
    var target = null;
    try {
      var saved = JSON.parse(localStorage.getItem('ideax_fb_direct_oauth_state') || '{}');
      var fresh = saved.at && Date.now() - saved.at < 15 * 60 * 1000;
      // 只允許前往 Facebook 官方授權頁
      if (fresh && typeof saved.url === 'string' && saved.url.indexOf('https://www.facebook.com/v19.0/dialog/oauth?') === 0) target = saved.url;
    } catch (e) {}
    if (target) {
      setTimeout(function () { location.replace(target); }, 60);
    } else {
      document.getElementById('m').innerHTML = '登入連結已過期，請<a href="/">回到網站</a>重新按一次 Facebook 登入。';
    }
  })();
</script>
</body>
</html>
