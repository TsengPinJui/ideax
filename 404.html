<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IdeaX 創點子 — 頁面跳轉中</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        if (path && path !== '/' && path !== '/404.html') {
          sessionStorage.setItem('ideax_redirect_path', path + search + hash);
          window.location.replace('/' + search + hash);
        } else {
          window.location.replace('/');
        }
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fafafa; color: #1f2937;">
    <div style="text-align: center; padding: 24px;">
      <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 8px;">頁面載入中...</h2>
      <p style="font-size: 0.875rem; color: #6b7280;">正在為您跳轉至 IdeaX 創點子，若未自動跳轉請 <a href="/" style="color: #d97706; text-decoration: underline;">點擊此處</a>。</p>
    </div>
  </body>
</html>
